
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <meta name="author" content="{{ author }}" />
    <meta property="og:title" content="{{ social_title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:type" content="{{ type }}" />
    <meta property="og:site_name" content="{{ site_name }}" />
    <meta property="og:image" content="{{ image }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="{{ image_alt }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ social_title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="{{ image }}" />
    <meta name="twitter:image:alt" content="{{ image_alt }}" />
    {% if article_author %}<meta property="article:author" content="{{ article_author }}" />{% endif %}
    {% if published %}<meta property="article:published_time" content="{{ published }}" />{% endif %}
    {% if modified %}<meta property="article:modified_time" content="{{ modified }}" />{% endif %}
